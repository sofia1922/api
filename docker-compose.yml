services:

  mongodb:
    image: mongo:7.0

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: library_db

    ports:
      - "27018:27017"

    volumes:
      - mongodb_data:/data/db


  app:
    build: .

    ports:
      - "8001:8000"

    environment:
      MONGODB_URL: mongodb://admin:password@mongodb:27017/library_db?authSource=admin

    depends_on:
      - mongodb

    command: sh -c "sleep 20 && uvicorn main:app --host 0.0.0.0 --port 8000"


  locust:
    image: locustio/locust

    ports:
      - "8089:8089"

    volumes:
      - ./:/mnt/locust

    command: >
      -f /mnt/locust/locustfile.py
      --host http://app:8000

    depends_on:
      - app


volumes:
  mongodb_data: